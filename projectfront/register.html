<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            color: #333;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2196f3;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Kick Start With an Exciting Course</h1>

    <form action="http://localhost:8080/courses/register" method="post">

        <label for="name">Enter your name</label>
        <input type="text" name="name" id="name" required>

        <br><br>

        <label for="emailId">Enter your Email</label>
        <input type="email" name="emailId" id="emailId" required>

        <br><br>

        <label for="courseName">Choose a course</label>
        <select id="courseName" name="courseName" required>
            <option value="">-- Select a Course --</option>
            <option value="Java">Java</option>
            <option value="Spring Boot">Spring Boot</option>
            <option value="Testing">Software Testing</option>
        </select>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
