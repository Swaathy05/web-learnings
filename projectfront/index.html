<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Builder</title>
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 20px;
        }

        button {
            background-color: cadetblue;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #3a8f8f;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>BUILD YOUR FUTURE THROUGH SKILLS</h1>

    <div class="btn-container">
        <a href="register.html"><button>REGISTER COURSES</button></a>
        <a href="available.html"><button>AVAILABLE COURSES</button></a>
        
    </div>
</body>
</html>
